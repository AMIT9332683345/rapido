services:
  - type: web
    name: amit-api
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: Flash
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_URLS
        sync: false
      - key: ADMIN_NAME
        value: Admin
      - key: ADMIN_MOBILE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OSRM_BASE_URL
        sync: false
      - key: ROUTING_ALLOW_ESTIMATE
        value: "false"
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: SUPPORT_PHONE
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
    disk:
      name: amit-uploads
      mountPath: /var/data
      sizeGB: 1
